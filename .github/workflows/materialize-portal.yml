name: Materialize Healing Lemon Portal

on:
  push:
    paths:
      - ".sync3/READY"

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize staged portal payload
        shell: bash
        run: |
          test -f .sync3/READY
          cat .sync3/part-* | base64 -d > /tmp/healing-lemon-portal.tgz
          tar -xzf /tmp/healing-lemon-portal.tgz -C .
          rm -rf .sync3 .sync2 .sync-payload
      - name: Verify portal
        shell: bash
        run: |
          npm test
          npm run check
      - name: Commit materialized portal
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat: publish Healing Lemon Portal v2"
          git push
